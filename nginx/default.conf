# Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    server_name 192.168.154.129 localhost;
    server_tokens off;

    # Endpoint nội bộ cho Prometheus Nginx Exporter lấy metrics
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cấu hình HTTPS Reverse Proxy
server {
    listen 443 ssl;
    server_name 192.168.154.129 localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers (Yêu cầu 3 & 6 - Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64M;

    # Chặn truy cập file ẩn (.env, .git, .htaccess...) và xmlrpc.php (Hardening)
    location ~ /\.(?!well-known) {
        deny all;
    }
    location = /xmlrpc.php {
        deny all;
    }

    # Proxy vào container WordPress
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
